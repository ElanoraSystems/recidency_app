function icon(name,cls){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="'+(cls||'')+'">'+(ICONS[name]||'')+'</svg>';}
function initials(name){return name.split(' ').map(function(p){return p[0];}).slice(0,2).join('').toUpperCase();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ----------------------------- DATE HELPERS ----------------------------- */
const TODAY = new Date('2026-08-26T09:00:00');
function D(offset){var d=new Date(TODAY);d.setDate(d.getDate()+offset);return d.toISOString().slice(0,10);}
function fmtDate(iso){if(!iso)return '—';var d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDateShort(iso){if(!iso)return '—';var d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});}
function daysUntil(iso){var d=new Date(iso+'T00:00:00');return Math.round((d-TODAY)/86400000);}
function fmtKWD(n){return (n<0?'-':'')+'KWD '+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});}
function pct(a,b){return b?Math.round(a/b*100):0;}

/* ----------------------------- UNITS OF MEASURE -----------------------------
   Drives every unit dropdown in the app (Item Master, Purchase Requests, Recipe
   ingredients). A unit is either a base unit (baseUnitId:null) or points at
   exactly one base with a multiplier (factorToBase) — e.g. kg = 1000 x g.
   Two units convert iff they share the same ultimate base (see convertQty()). */
DB.unitsOfMeasure = [
  {id:'uom-g', label:'g', baseUnitId:null, factorToBase:1},
  {id:'uom-kg', label:'kg', baseUnitId:'uom-g', factorToBase:1000},
  {id:'uom-ml', label:'ml', baseUnitId:null, factorToBase:1},
  {id:'uom-l', label:'L', baseUnitId:'uom-ml', factorToBase:1000},
  {id:'uom-units', label:'units', baseUnitId:null, factorToBase:1},
  {id:'uom-pack', label:'pack', baseUnitId:null, factorToBase:1},
  {id:'uom-bottle', label:'bottle', baseUnitId:null, factorToBase:1},
  {id:'uom-set', label:'set', baseUnitId:null, factorToBase:1},
];
var uomSeq=8;
function uomById(id){ return DB.unitsOfMeasure.find(u=>u.id===id); }
function uomByLabel(label){ return DB.unitsOfMeasure.find(u=>u.label===String(label||'').trim()); }
function uomUltimateBase(u){ return u.baseUnitId || u.id; }
function uomFactorToBase(u){ return u.baseUnitId ? u.factorToBase : 1; }
function unitsCompatible(fromLabel, toLabel){
  var fu=uomByLabel(fromLabel), tu=uomByLabel(toLabel);
  if(!fu||!tu) return false;
  return uomUltimateBase(fu)===uomUltimateBase(tu);
}

/* Deterministic pseudo-random helpers so historical attendance stays stable across reloads */
function seededRand(str){ var h=0; for(var i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))|0;} return ((h%1000)+1000)%1000/1000; }
function minToTime(m){ var h=Math.floor(m/60), mm=Math.round(m%60); return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm; }
function fmtTime12(t){ if(!t) return '—'; var p=t.split(':'); var h=Number(p[0]), m=p[1]; var ap=h>=12?'PM':'AM'; var h12=h%12; if(h12===0)h12=12; return h12+':'+m+' '+ap; }
function hoursBetween(t1,t2){ if(!t1||!t2) return null; var p1=t1.split(':'),p2=t2.split(':'); var m1=Number(p1[0])*60+Number(p1[1]), m2=Number(p2[0])*60+Number(p2[1]); return Math.round((m2-m1)/6)/10; }
function fmtHours(h){ if(h==null) return '—'; var hh=Math.floor(h), mm=Math.round((h-hh)*60); return hh+'h '+(mm?mm+'m':''); }
/* Historical (non-today) attendance is generated deterministically per staff+date so monthly reports look real without persisting 30 days of records */
function historicalAttendance(staffId, dateIso){
  var seed=staffId+'_'+dateIso;
  var r=seededRand(seed);
  if(r<0.05) return {status:'Absent', checkIn:null, checkOut:null, hours:0};
  if(r<0.09) return {status:'Leave', checkIn:null, checkOut:null, hours:0};
  var inMin=450+Math.floor(seededRand(seed+'in')*45);
  var outMin=960+Math.floor(seededRand(seed+'out')*90);
  return {status:'Present', checkIn:minToTime(inMin), checkOut:minToTime(outMin), hours:hoursBetween(minToTime(inMin),minToTime(outMin))};
}
function attendanceOn(staffId, dateIso){
  if(dateIso===D(0)){
    var a=DB.attendanceToday.find(x=>x.staffId===staffId);
    if(!a) return {status:'Absent', checkIn:null, checkOut:null, hours:null};
    return {status:a.status, checkIn:a.checkIn, checkOut:a.checkOut, hours:hoursBetween(a.checkIn,a.checkOut)};
  }
  return historicalAttendance(staffId, dateIso);
}

/* Deterministic pseudo-QR visual for the demo — not a real, decodable QR code
   (no external QR-generation library is reachable from this sandboxed page),
   but a stable, area-specific pattern that reads as a QR code at a glance. */
function pseudoQrSvg(seedStr, px){
  px=px||160; var size=14, cell=px/size;
  var h=0; for(var i=0;i<seedStr.length;i++){ h=(h*31+seedStr.charCodeAt(i))|0; }
  var rnd=function(){ h=(h*1103515245+12345)|0; return ((h>>>16)&0xff)/255; };
  var rects='';
  for(var r=0;r<size;r++){ for(var c=0;c<size;c++){
    var inFinder=(r<3&&c<3)||(r<3&&c>=size-3)||(r>=size-3&&c<3);
    if(inFinder) continue;
    if(rnd()<0.46) rects+='<rect x="'+(c*cell)+'" y="'+(r*cell)+'" width="'+cell+'" height="'+cell+'"/>';
  } }
  var fp=function(x,y){ return '<rect x="'+x+'" y="'+y+'" width="'+(cell*3)+'" height="'+(cell*3)+'" fill="none" stroke="currentColor" stroke-width="'+(cell*0.7)+'"/><rect x="'+(x+cell*1.1)+'" y="'+(y+cell*1.1)+'" width="'+(cell*0.8)+'" height="'+(cell*0.8)+'"/>'; };
  return '<svg viewBox="0 0 '+px+' '+px+'" width="'+px+'" height="'+px+'" style="background:#fff;color:#141413;border-radius:6px;">'+rects+fp(0,0)+fp(px-cell*3,0)+fp(0,px-cell*3)+'</svg>';
}

/* Cost engine: computes usable yield & cost AFTER preparation loss, not naive purchased-quantity cost.
   Recursively resolves sub-recipe ingredients (see resolveRecipe) — a sub-recipe's cost-per-gram is its
   own total cost / final yield, so nested sub-recipes always reflect current stock costs, all the way down.
   `visiting` is a defensive cycle guard (save-time validation in addRecipeIngredient is what actually
   prevents a cycle from being created) so a bad edit can't recurse forever. */
function resolveRecipe(r, visiting){
  visiting = visiting ? Object.assign({}, visiting) : {};
  if(visiting[r.id]) return {totalCost:0, rawYieldG:r.rawYieldG||1000, finalYieldG:r.rawYieldG||1000, portions:1, costPerPortion:0, lines:[]};
  visiting[r.id]=true;
  var lines=(r.ingredients||[]).map(function(ing){
    var yieldPct=ing.yieldPct||100;
    var name='Unknown item', unit='—', costPerUnit=0, qtyInStockUnit=ing.qty, displayQty=ing.qty;
    if(ing.subRecipeId){
      var sub=DB.recipes.find(x=>x.id===ing.subRecipeId);
      if(sub){
        var subCost=resolveRecipe(sub, visiting);
        name=sub.name; unit='g';
        costPerUnit = subCost.finalYieldG ? subCost.totalCost/subCost.finalYieldG : 0;
      }
    } else {
      var stock=DB.foodInventory.find(f=>f.id===ing.foodInventoryId);
      if(stock){
        name=stock.name; costPerUnit=stock.cost;
        unit = ing.overrideUnitId ? ((uomById(ing.overrideUnitId)||{}).label || stock.unit) : stock.unit;
        qtyInStockUnit = ing.overrideUnitId ? convertQty(ing.qty, unit, stock.unit) : ing.qty;
      }
    }
    var lineCost=Math.round(qtyInStockUnit*costPerUnit/(yieldPct/100)*1000)/1000;
    return {name:name, unit:unit, qty:displayQty, yieldPct:yieldPct, lineCost:lineCost,
      costPerUnit: displayQty ? Math.round(lineCost/displayQty*1e6)/1e6 : 0,
      foodInventoryId:ing.foodInventoryId||null, subRecipeId:ing.subRecipeId||null, overrideUnitId:ing.overrideUnitId||null};
  });
  var totalCost=lines.reduce((s,l)=>s+l.lineCost,0);
  var rawYieldG=r.rawYieldG||1000, lossPct=r.prepLossPct||0, portionSizeG=r.portionSizeG||250;
  var finalYieldG=Math.round(rawYieldG*(1-lossPct/100));
  var portions=Math.max(1,Math.round(finalYieldG/portionSizeG));
  var costPerPortion=totalCost/portions;
  return {totalCost:Math.round(totalCost*1000)/1000, rawYieldG:rawYieldG, finalYieldG:finalYieldG, portions:portions, costPerPortion:Math.round(costPerPortion*1000)/1000, lines:lines};
}
function computeRecipeCost(r){ return resolveRecipe(r); }

  return (r.ingredients||[]).some(function(ing){ return ing.subRecipeId && recipeIncludesTransitively(rootId, ing.subRecipeId, visited); });
}

/* Recursively expands a recipe into leaf FoodInventory consumption at the given
   scale (the fraction of this recipe's full authored batch — its rawYieldG —
   actually used). This prototype tracks no separate "prepared batch" stock for
   a sub-recipe, so using one as an ingredient means walking down into ITS
   ingredients (and so on) until real stock items are reached, exactly like the
   direct ingredients of the top-level recipe. */
function expandConsumption(r, scale, visiting){
  visiting = visiting ? Object.assign({}, visiting) : {};
  if(visiting[r.id]) return [];
  visiting[r.id]=true;
  var out=[];
  (r.ingredients||[]).forEach(function(ing){
    var yieldFrac=(ing.yieldPct||100)/100;
    if(ing.subRecipeId){
      var sub=DB.recipes.find(x=>x.id===ing.subRecipeId); if(!sub) return;
      var subFinalYieldG=Math.round((sub.rawYieldG||1000)*(1-(sub.prepLossPct||0)/100));
      var qtyGNeeded=(ing.qty*scale)/yieldFrac;
      var subScale = subFinalYieldG ? qtyGNeeded/subFinalYieldG : 0;
      out=out.concat(expandConsumption(sub, subScale, visiting));
    } else {
      var stock=DB.foodInventory.find(f=>f.id===ing.foodInventoryId); if(!stock) return;
      var unit = ing.overrideUnitId ? ((uomById(ing.overrideUnitId)||{}).label || stock.unit) : stock.unit;
      var qtyInStockUnit = ing.overrideUnitId ? convertQty(ing.qty, unit, stock.unit) : ing.qty;
      out.push({stock:stock, qty:(qtyInStockUnit*scale)/yieldFrac});
    }
  });
  return out;
}
function consumeIngredientsForMeal(recipeId, mealsServed, dateIso, mealLogId){
  var r=DB.recipes.find(x=>x.id===recipeId); if(!r||!r.ingredients||!r.ingredients.length) return;
  var c=computeRecipeCost(r); var portions=c.portions||1;
  var scale=mealsServed/portions;
  var agg={};
  expandConsumption(r, scale).forEach(function(e){
    agg[e.stock.id]=agg[e.stock.id]||{stock:e.stock, qty:0};
    agg[e.stock.id].qty+=e.qty;
  });
  Object.keys(agg).forEach(function(id){
    var a=agg[id], consumedQty=Math.round(a.qty*1000)/1000;
    a.stock.qty=Math.max(0, Math.round((a.stock.qty-consumedQty)*1000)/1000);
    consumptionSeq++;
    DB.consumptionLog.unshift({id:'cl-'+consumptionSeq, date:dateIso, recipeId:recipeId, dish:r.name, mealsServed:mealsServed, ingredient:a.stock.name, qtyConsumed:consumedQty, unit:a.stock.unit, matchedStock:a.stock.name, mealLogId:mealLogId||null});
  });
}

/* Dynamic, UOM-table-driven conversion (see DB.unitsOfMeasure above) — replaces
   the old hardcoded g/kg/ml/L pairs so any unit added in Settings converts
   automatically everywhere. Unknown or incompatible pairs pass the quantity
   through unchanged rather than throwing, matching the old lenient behavior
   for the many call sites that don't expect an error. */
function convertQty(qty, fromUnit, toUnit){
  var fu=uomByLabel(fromUnit), tu=uomByLabel(toUnit);
  if(!fu||!tu||fu.id===tu.id) return qty;
  if(uomUltimateBase(fu)!==uomUltimateBase(tu)) return qty;
  return qty*uomFactorToBase(fu)/uomFactorToBase(tu);
}

/* ----------------------------- NOTIFICATIONS ----------------------------- */
function buildNotifications(){
  const list=[];
  DB.inventory.filter(i=>i.stock<i.min).forEach(i=>list.push({id:'n-inv-'+i.id, priority:'High', cat:'Inventory', title:i.name+' is below minimum stock', sub:i.stock+' '+i.unit+' left (min '+i.min+')', date:D(0), route:'inventory'}));
  DB.foodInventory.filter(f=>daysUntil(f.expiry)<=2).forEach(f=>list.push({id:'n-food-'+f.id, priority: daysUntil(f.expiry)<0?'Critical':'High', cat:'Kitchen', title:f.name+(daysUntil(f.expiry)<0?' has expired':' expires soon'), sub:'Batch '+f.batch+' · '+fmtDate(f.expiry), date:D(0), route:'kitchen'}));
  DB.documents.filter(d=>d.expiry && daysUntil(d.expiry)<=30).forEach(d=>list.push({id:'n-doc-'+d.id, priority: daysUntil(d.expiry)<=10?'Critical':'Medium', cat:'Documents', title:d.name+' expires in '+daysUntil(d.expiry)+' days', sub:d.category, date:D(0), route:'documents'}));
  DB.purchaseRequests.filter(p=>p.status==='Pending Approval').forEach(p=>list.push({id:'n-pr-'+p.id, priority:'Medium', cat:'Purchasing', title:'Purchase request awaiting approval', sub:p.item+' × '+p.qty+' ('+p.requestedBy+')', date:p.requestDate, route:'purchasing'}));
  DB.tasks.filter(t=>t.status==='Overdue').forEach(t=>list.push({id:'n-tsk-'+t.id, priority:'High', cat:'Tasks', title:'Overdue task: '+t.title, sub:'Due '+fmtDate(t.dueDate)+' · '+staffName(t.assignee), date:t.dueDate, route:'tasks'}));
  DB.pmSchedule.filter(p=>daysUntil(p.dueDate)<=7).forEach(p=>{const a=assetById(p.assetId);list.push({id:'n-pm-'+p.id, priority: daysUntil(p.dueDate)<0?'Critical':'Medium', cat:'Maintenance', title:'Preventive maintenance due: '+(a?a.name:''), sub:p.task, date:p.dueDate, route:'maintenance'});});
  DB.vehicles.forEach(v=>{
    if(daysUntil(v.insuranceExpiry)<=15) list.push({id:'n-veh-ins-'+v.id, priority: daysUntil(v.insuranceExpiry)<0?'Critical':'High', cat:'Vehicles', title:v.name+' insurance expires in '+daysUntil(v.insuranceExpiry)+' days', sub:v.reg, date:D(0), route:'vehicles'});
    if(daysUntil(v.regExpiry)<=15) list.push({id:'n-veh-reg-'+v.id, priority: daysUntil(v.regExpiry)<0?'Critical':'High', cat:'Vehicles', title:v.name+' registration expires in '+daysUntil(v.regExpiry)+' days', sub:v.reg, date:D(0), route:'vehicles'});
  });
  DB.staff.filter(s=>!s.present && !s.offSiteRole).forEach(s=>list.push({id:'n-abs-'+s.id, priority:'Low', cat:'Staff', title:s.name+' is absent today', sub:s.position, date:D(0), route:'people'}));
  DB.guests.filter(g=>daysUntil(g.arrival)<=2).forEach(g=>list.push({id:'n-gst-'+g.id, priority:'Medium', cat:'Guests', title:g.name+' arriving in '+daysUntil(g.arrival)+' day(s)', sub:g.room, date:g.arrival, route:'guests'}));
  DB.events.filter(e=>daysUntil(e.date)<=7).forEach(e=>list.push({id:'n-evt-'+e.id, priority:'Low', cat:'Events', title:e.name+' in '+daysUntil(e.date)+' days', sub:fmtDate(e.date), date:e.date, route:'events'}));
  DB.proposedMenus.filter(m=>m.status==='Proposed').forEach(m=>list.push({id:'n-mp-'+m.id, priority:'Medium', cat:'Kitchen', title:'Menu proposal awaiting approval', sub:m.occasion+' · '+fmtDate(m.forDate), date:m.forDate, route:'kitchen'}));
  DB.wasteLog.filter(w=>w.status==='Pending Review').forEach(w=>list.push({id:'n-waste-'+w.id, priority:'Low', cat:'Kitchen', title:'Waste log awaiting review', sub:w.reason+' · '+w.lines.length+' item(s)', date:w.date, route:'kitchen'}));
  DB.staffMealPlans.filter(p=>p.status==='Pending Approval').forEach(p=>list.push({id:'n-smp-'+p.id, priority:'Medium', cat:'Kitchen', title:'Staff meal plan awaiting approval', sub:p.occasionType+' · week of '+fmtDateShort(p.weekStartDate), date:p.weekStartDate, route:'kitchen'}));
  // Only flag areas that are established patrol checkpoints (have some scan
  // history) — most residence areas (bedrooms, offices) are never meant to
  // be checkpoints, so this stays a useful signal rather than noise.
  var checkpointAreaIds=new Set(DB.patrolLog.map(p=>p.areaId)), patrolledToday=areasPatrolledToday();
  DB.areas.filter(a=>checkpointAreaIds.has(a.id) && !patrolledToday.has(a.id)).forEach(a=>list.push({id:'n-patrol-'+a.id, priority:'Low', cat:'Security', title:a.name+' not patrolled today', sub:'No checkpoint scan logged yet', date:D(0), route:'patrol'}));
  const order={Critical:0,High:1,Medium:2,Low:3};
  return list.sort((a,b)=>order[a.priority]-order[b.priority]);
}

/* ----------------------------- CHART BUILDERS (SVG) ----------------------------- */
function donutChart(segments, opts){
  opts=opts||{}; var size=opts.size||120, stroke=opts.stroke||16, r=(size-stroke)/2, c=2*Math.PI*r;
  var total=segments.reduce((s,x)=>s+x.value,0)||1, offset=0, parts='';
  segments.forEach(function(seg){
    var frac=seg.value/total, len=frac*c;
    parts+='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+seg.color+'" stroke-width="'+stroke+'" stroke-dasharray="'+len+' '+(c-len)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+size/2+' '+size/2+')" stroke-linecap="butt"><title>'+esc(seg.label)+': '+seg.value+'</title></circle>';
    offset+=len;
  });
  var centerLabel=opts.centerValue!=null?'<text x="'+size/2+'" y="'+(size/2-2)+'" text-anchor="middle" font-family="Fraunces,serif" font-weight="600" font-size="'+(opts.centerSize||20)+'" fill="var(--ink-900)">'+esc(opts.centerValue)+'</text><text x="'+size/2+'" y="'+(size/2+16)+'" text-anchor="middle" font-family="Manrope,sans-serif" font-size="10" fill="var(--ink-400)">'+esc(opts.centerSub||'')+'</text>':'';
  return '<svg viewBox="0 0 '+size+' '+size+'" style="width:'+size+'px;height:'+size+'px;flex-shrink:0;" role="img" aria-label="donut chart">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--surface-sunken)" stroke-width="'+stroke+'"/>'+parts+centerLabel+'</svg>';
}
function barChartH(rows, opts){
  // rows: [{label, value, color}]  horizontal bars with labels, for cards
  opts=opts||{}; var max=Math.max.apply(null, rows.map(r=>r.value))||1;
  return '<div class="flex-col gap-2">'+rows.map(function(r){
    var w=Math.max(pct(r.value,max),3);
    return '<div class="flex-col gap-1"><div class="flex justify-between small"><span style="font-weight:600;color:var(--ink-700)">'+esc(r.label)+'</span><span class="muted tabular">'+(opts.fmt?opts.fmt(r.value):r.value)+'</span></div>'+
    '<div class="progress"><i style="width:'+w+'%;background:'+(r.color||'var(--brass-500)')+'"></i></div></div>';
  }).join('')+'</div>';
}
function sparkline(values, opts){
  opts=opts||{}; var w=opts.w||160,h=opts.h||44,pad=4;
  var max=Math.max.apply(null,values), min=Math.min.apply(null,values); if(max===min){max+=1;}
  var step=(w-pad*2)/(values.length-1);
  var pts=values.map(function(v,i){return [pad+i*step, h-pad-((v-min)/(max-min))*(h-pad*2)];});
  var path=pts.map(function(p,i){return (i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
  var area=path+' L'+pts[pts.length-1][0].toFixed(1)+' '+(h-pad)+' L'+pts[0][0].toFixed(1)+' '+(h-pad)+' Z';
  var last=pts[pts.length-1];
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:'+w+'px;height:'+h+'px;flex-shrink:0;"><path d="'+area+'" fill="'+(opts.color||'var(--brass-400)')+'" opacity="0.16"/><path d="'+path+'" fill="none" stroke="'+(opts.color||'var(--brass-500)')+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.6" fill="'+(opts.color||'var(--brass-500)')+'"/></svg>';
}

      return '<div class="alert-row" style="border-bottom:1px solid var(--border);border-radius:0;cursor:pointer;" onclick="event.preventDefault();event.stopPropagation();App.setRoute(\''+n.route+'\')">'+

function updateSearchResults(q){
  State.searchQuery=q;
  var el=document.getElementById('globalSearchResults');
  if(!el) return;
  if(!q || q.trim().length<2){ el.innerHTML=''; el.className=''; return; }
  var results=globalSearch(q);
  el.className='search-results';
  el.innerHTML = results.length ? results.map(function(r){
    return '<a href="#" class="rail-link" style="color:var(--ink-700);border-radius:0;padding:10px 14px;" onclick="event.preventDefault();document.getElementById(\'globalSearchInput\').value=\'\';updateSearchResults(\'\');App.setRoute(\''+r.route+'\')">'+
      '<span style="color:var(--brass-600)">'+icon(r.icon)+'</span><span class="label" style="display:flex;flex-direction:column;"><b style="font-size:13px;">'+esc(r.title)+'</b><span class="small muted">'+esc(r.sub)+'</span></span>'+
    '</a>';
  }).join('') : '<div class="empty" style="padding:20px;">No matches for "'+esc(q)+'"</div>';
}
function globalSearch(q){
  q=q.toLowerCase(); var out=[];
  DB.staff.forEach(s=>{if(s.name.toLowerCase().includes(q)||s.position.toLowerCase().includes(q)) out.push({title:s.name, sub:'Staff · '+s.position, route:'people', icon:'people'});});
  DB.tasks.forEach(t=>{if(t.title.toLowerCase().includes(q)) out.push({title:t.title, sub:'Task · '+t.status, route:'tasks', icon:'tasks'});});
  DB.inventory.forEach(i=>{if(i.name.toLowerCase().includes(q)) out.push({title:i.name, sub:'Inventory · '+i.category, route:'inventory', icon:'inventory'});});
  DB.suppliers.forEach(s=>{if(s.name.toLowerCase().includes(q)) out.push({title:s.name, sub:'Supplier · '+s.category, route:'purchasing', icon:'purchasing'});});
  DB.assets.forEach(a=>{if(a.name.toLowerCase().includes(q)) out.push({title:a.name, sub:'Asset · '+a.location, route:'maintenance', icon:'maintenance'});});
  DB.guests.forEach(g=>{if(g.name.toLowerCase().includes(q)) out.push({title:g.name, sub:'Guest · arriving '+fmtDate(g.arrival), route:'guests', icon:'guests'});});
  DB.events.forEach(e=>{if(e.name.toLowerCase().includes(q)) out.push({title:e.name, sub:'Event · '+fmtDate(e.date), route:'events', icon:'events'});});
  DB.documents.forEach(d=>{if(d.name.toLowerCase().includes(q)) out.push({title:d.name, sub:'Document · '+d.category, route:'documents', icon:'documents'});});
  DB.expenses.forEach(e=>{if(e.notes.toLowerCase().includes(q)||e.supplier.toLowerCase().includes(q)) out.push({title:e.supplier+' — '+fmtKWD(e.amount), sub:'Expense · '+e.category, route:'expenses', icon:'expenses'});});
  DB.recipes.forEach(r=>{if(r.name.toLowerCase().includes(q)||r.category.toLowerCase().includes(q)) out.push({title:r.name, sub:'Recipe · '+r.category, route:'kitchen', icon:'kitchen'});});
  DB.mealLog.forEach(m=>{if(m.dish.toLowerCase().includes(q)) out.push({title:m.dish, sub:'Meal log · '+m.category+' · '+fmtDateShort(m.date), route:'kitchen', icon:'kitchen'});});
  DB.proposedMenus.forEach(m=>{if(m.occasion.toLowerCase().includes(q)) out.push({title:m.occasion, sub:'Menu proposal · '+m.status, route:'kitchen', icon:'kitchen'});});
  DB.vehicles.forEach(v=>{if(v.name.toLowerCase().includes(q)||v.reg.toLowerCase().includes(q)) out.push({title:v.name, sub:'Vehicle · '+v.reg, route:'vehicles', icon:'car'});});
  return out.slice(0,10);
}

MODAL_BUILDERS.consumptionHistory = function(p){

  '<div class="modal-body">'+
    '<p class="small muted">Deducted automatically from Main Inventory whenever a recipe-based dish is logged as served. Used to track usage, spot unusual consumption or wastage, and flag when items need reordering — not to calculate the kitchen\'s monthly expense (that comes from purchases/GRNs).</p>'+
    (rows.length?'<div class="wrap-scroll"><table><thead><tr><th>Date</th><th>Dish</th><th class="num">Meals</th><th>Ingredient</th><th class="num">Qty consumed</th><th>Matched stock item</th></tr></thead><tbody>'+
      rows.map(c=>'<tr><td class="small">'+fmtDateShort(c.date)+'</td><td class="small row-title">'+esc(c.dish)+'</td><td class="num tabular">'+c.mealsServed+'</td><td class="small">'+esc(c.ingredient)+'</td><td class="num tabular">'+c.qtyConsumed+' '+c.unit+'</td><td class="small '+(c.matchedStock==='Not matched to any stock item'?'muted':'')+'">'+esc(c.matchedStock)+'</td></tr>').join('')+
    '</tbody></table></div>':'<div class="empty">'+icon('checkCircle')+'<div>No consumption logged yet.</div></div>')+
  '</div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div></div>';

function renderModal(){
  if(!State.modal) return '';
  var builder = MODAL_BUILDERS[State.modal.type];
  var inner = builder ? builder(State.modal.payload||{}) : '<div class="modal"><div class="modal-body">Not found.</div></div>';
  return '<div class="overlay" onclick="closeModal()"><div onclick="event.stopPropagation()">'+inner+'</div></div>';
}
function runModalConfirm(){ if(State.modal && State.modal.payload && State.modal.payload.onConfirm){ State.modal.payload.onConfirm(); } closeModal(); }

function kpis(){
  var staffOnsite = DB.staff.filter(s=>!s.offSiteRole);
  var present = staffOnsite.filter(s=>s.present).length;
  var todaysTasks = DB.tasks.filter(t=>t.dueDate===D(0));
  var doneToday = todaysTasks.filter(t=>t.status==='Completed'||t.status==='Verified').length;
  var hkAvg = Math.round(DB.areas.reduce((s,a)=>s+a.completion,0)/DB.areas.length);
  var maintPending = DB.maintenanceRequests.filter(m=>!['Closed','Verified'].includes(m.status)).length;
  var lowStock = DB.inventory.filter(i=>i.stock<i.min).length;
  var purchPending = DB.purchaseRequests.filter(p=>p.status==='Pending Approval').length;
  var todaySpend = DB.expenses.filter(e=>e.date===D(0)).reduce((s,e)=>s+e.amount,0);
  var monthSpend = DB.expenses.reduce((s,e)=>s+e.amount,0);
  return {staffOnsite:staffOnsite.length, present:present, todaysTasks:todaysTasks.length, doneToday:doneToday,
    taskPct: pct(doneToday, todaysTasks.length||1), hkAvg:hkAvg, maintPending:maintPending, lowStock:lowStock,
    purchPending:purchPending, todaySpend:todaySpend, monthSpend:monthSpend};
}
function statTile(o){
  return '<div class="card stat">'+
    '<div class="top"><span class="label">'+esc(o.label)+'</span><span class="ico">'+icon(o.icon)+'</span></div>'+
    '<div class="value">'+esc(o.value)+(o.suffix?' <small>'+esc(o.suffix)+'</small>':'')+'</div>'+
    (o.progress!=null?'<div class="bar"><i style="width:'+o.progress+'%;'+(o.progressColor?'background:'+o.progressColor+';':'')+'"></i></div>':'')+
    (o.sub?'<div class="small muted">'+esc(o.sub)+'</div>':'')+
  '</div>';
}
function greeting(){
  var h=TODAY.getHours();
  return h<12?'Good morning':h<17?'Good afternoon':'Good evening';
}

    statTile({label:'Overall Completion', icon:'checkCircle', value:pct(doneMine,myTasks.length||1)+'%', progress:pct(doneMine,myTasks.length||1), sub:doneMine+' of '+myTasks.length+' tasks'})+

function peopleAttendance(){
  var onsite=DB.staff.filter(s=>!s.offSiteRole);
  var present=onsite.filter(s=>s.present).length;
  var checkedOut=DB.attendanceToday.filter(a=>a.checkOut).length;
  var totalHours=DB.attendanceToday.reduce((s,a)=>s+(hoursBetween(a.checkIn,a.checkOut)||0),0);
  return '<div class="grid g-cols-3" style="margin-bottom:16px;">'+
    statTile({label:'Present Today', icon:'people', value:present+'/'+onsite.length})+
    statTile({label:'Checked Out', icon:'clock', value:checkedOut, sub:'Shift completed'})+
    statTile({label:'Hours Logged', icon:'checkCircle', value:fmtHours(totalHours), sub:'Completed shifts only'})+
  '</div>'+
  '<div class="card"><div class="card-head"><h3>Today’s attendance</h3><span class="sub">'+fmtDate(D(0))+'</span></div><div class="wrap-scroll"><table><thead><tr><th>Employee</th><th>Department</th><th>Check-in</th><th>Check-out</th><th class="num">Hours</th><th>Status</th><th></th></tr></thead><tbody>'+
    onsite.map(function(s){
      var att=DB.attendanceToday.find(a=>a.staffId===s.id);
      var hrs=att?hoursBetween(att.checkIn,att.checkOut):null;
      var actions;
      if(!s.present){ actions='<button class="btn btn-soft btn-sm" onclick="checkInStaff(\''+s.id+'\')">Check In</button>'; }
      else if(att && !att.checkIn){ actions='<button class="btn btn-soft btn-sm" onclick="checkInStaff(\''+s.id+'\')">Check In</button>'; }
      else if(att && att.checkIn && !att.checkOut){ actions='<button class="btn btn-soft btn-sm" onclick="checkOutStaff(\''+s.id+'\')">Check Out</button>'; }
      else { actions='<span class="badge good">Shift complete</span>'; }
      return '<tr><td><div class="flex items-center gap-2"><div class="avatar">'+initials(s.name)+'</div><span class="row-title">'+esc(s.name)+'</span></div></td><td class="small muted">'+esc(s.dept)+'</td>'+

      '<td><span class="badge '+statusBadgeClass(s.present?'Present':(s.status==='On Leave'?'On Leave':'Absent'))+'">'+(s.present?'Present':s.status)+'</span></td>'+
      '<td class="flex gap-2">'+actions+(s.present?' <button class="btn btn-ghost btn-sm" onclick="markAbsentToday(\''+s.id+'\')">Mark Absent</button>':'')+'</td></tr>';
    }).join('')+
  '</tbody></table></div></div>';
}
function checkInStaff(id){
  var s=staffById(id); s.present=true; s.status='Active';
  var att=DB.attendanceToday.find(a=>a.staffId===id);
  var time=minToTime(450+Math.floor(Math.random()*30));
  if(att){ att.checkIn=time; att.checkOut=null; att.status='Present'; } else { DB.attendanceToday.push({staffId:id, checkIn:time, checkOut:null, status:'Present'}); }
  toast(s.name+' checked in at '+fmtTime12(time)); render();
}
function checkOutStaff(id){
  var s=staffById(id); var att=DB.attendanceToday.find(a=>a.staffId===id);
  var time=minToTime(960+Math.floor(Math.random()*60));
  if(att){ att.checkOut=time; }
  toast(s.name+' checked out at '+fmtTime12(time)+' · '+fmtHours(hoursBetween(att.checkIn,time))+' logged'); render();
}
function markAbsentToday(id){
  var s=staffById(id); s.present=false; s.status='Absent';
  var att=DB.attendanceToday.find(a=>a.staffId===id); if(att){ att.checkIn=null; att.checkOut=null; att.status='Absent'; }
  toast(s.name+' marked absent'); render();
}

      '<td class="tabular small">'+fmtTime12(r.a.checkIn)+'</td><td class="tabular small">'+fmtTime12(r.a.checkOut)+'</td><td class="num tabular small">'+(r.a.hours?fmtHours(r.a.hours):'—')+'</td>'+
      '<td><span class="badge '+statusBadgeClass(r.a.status==='Present'?'Present':r.a.status==='Leave'?'On Leave':'Absent')+'">'+r.a.status+'</span></td></tr>';
    }).join('')+
  '</tbody></table></div></div>';

function setAttendanceReportDate(d){ State.attendanceReportDate=d||D(0); render(); }
function attendanceMonthlyReport(){
  var onsite=DB.staff.filter(s=>!s.offSiteRole);
  var days=[]; for(var i=29;i>=0;i--){ days.push(D(-i)); }
  var rows=onsite.map(function(s){
    var present=0, absent=0, leave=0, hours=0;
    days.forEach(function(d){
      var a=attendanceOn(s.id,d);
      if(a.status==='Present'){present++; hours+=(a.hours||0);}
      else if(a.status==='Absent') absent++;
      else if(a.status==='Leave') leave++;
    });
    return {s:s, present:present, absent:absent, leave:leave, hours:hours};
  });
  return '<div class="small muted" style="margin-bottom:14px;">Rolling 30-day summary · '+fmtDate(D(-29))+' – '+fmtDate(D(0))+'</div>'+
  '<div class="card"><div class="wrap-scroll"><table><thead><tr><th>Employee</th><th>Position</th><th class="num">Present</th><th class="num">Absent</th><th class="num">Leave</th><th class="num">Total Hours</th><th class="num">Avg Hrs/Day</th></tr></thead><tbody>'+
    rows.map(function(r){
      return '<tr><td><div class="flex items-center gap-2"><div class="avatar">'+initials(r.s.name)+'</div><span class="row-title">'+esc(r.s.name)+'</span></div></td><td class="small muted">'+esc(r.s.position)+'</td>'+

    '<select onchange="State.taskFilter.category=this.value;render()" style="width:auto;">'+

function toggleChecklist(id,idx){ var t=DB.tasks.find(x=>x.id===id); t.checklist[idx].done=!t.checklist[idx].done; render(); openModal('taskDetail',{id:id}); }
function advanceTask(id){
  var t=DB.tasks.find(x=>x.id===id);
  var next={'Pending':'In Progress','In Progress':'Completed','Completed':'Verified','Overdue':'In Progress'}[t.status];
  if(next){ t.status=next; t.verified=next==='Verified'; toast('Task moved to '+next); }
  closeModal(); render();
}
function addComment(id){
  var text=val('newComment'); if(!text) return;
  var t=DB.tasks.find(x=>x.id===id); t.comments.push({by:currentUserProfile().name, text:text, at:D(0)});
  openModal('taskDetail',{id:id});
}
function attachPhoto(id){ var t=DB.tasks.find(x=>x.id===id); t.photos++; toast('Photo attached (simulated)'); openModal('taskDetail',{id:id}); }

  var totalValue=DB.inventory.reduce((s,i)=>s+i.stock*i.avgPrice,0);
  var filtered=DB.inventory.filter(i=>State.invCategory==='all'||i.category===State.invCategory);
  return '<p class="small muted" style="margin-bottom:14px;">Stock levels here always come from Item Master — add a new item from the Item Master tab and its stock record is created automatically.</p>'+

    statTile({label:'Total Items', icon:'inventory', value:DB.inventory.length, sub:cats.length+' categories'})+
    statTile({label:'Below Minimum', icon:'alertTriangle', value:lowCount, progressColor:'var(--status-critical)', progress:pct(lowCount,DB.inventory.length), sub:'Need reordering'})+
    statTile({label:'Estimated Value', icon:'expenses', value:fmtKWD(totalValue), sub:'At average purchase price'})+
  '</div>'+
  '<div class="flex items-center gap-2" style="margin-bottom:12px;flex-wrap:wrap;">'+
    '<select onchange="State.invCategory=this.value;render()" style="width:auto;"><option value="all">All categories</option>'+cats.map(c=>'<option'+(State.invCategory===c?' selected':'')+'>'+c+'</option>').join('')+'</select>'+
    '<span class="small muted" style="margin-left:auto;">'+filtered.length+' items</span>'+
  '</div>'+

/* Item code is always server-generated (sequential ITM-1001, ITM-1002, ...)
   — no manual entry, so codes can never collide or drift out of format. */
function nextItemCode(){
  var max=1000;
  DB.itemMaster.forEach(function(im){
    var m=/^ITM-(\d+)$/.exec(im.code||''); if(m) max=Math.max(max, Number(m[1]));
  });
  return 'ITM-'+(max+1);
}

function submitNewItemMaster(){
  var name=val('im_name'); if(!name){toast('Please enter an item name','error');return;}
  var stockType=val('im_type')||'general';
  var uom=val('im_uom')||'units';
  var supplier=val('im_sup1')||'—';
  var price=Number(val('im_price'))||0;
  var stock=Number(val('im_stock'))||0;
  var code=nextItemCode();
  var stockId;
  if(stockType==='food'){
    stockId='fd-'+(DB.foodInventory.length+1)+Date.now().toString().slice(-3);
    DB.foodInventory.unshift({id:stockId, name:name, category:'Other', qty:stock, unit:uom, batch:'', expiry:null, location:'Dry Store', supplier:supplier, cost:price});
  } else {
    stockId='iv-'+(DB.inventory.length+1)+Date.now().toString().slice(-3);
    DB.inventory.unshift({id:stockId, name:name, category:'Other', sku:code, unit:uom, stock:stock, min:Number(val('im_min'))||1, max:Number(val('im_reorder'))*2||10, location:'Store Room', supplier:supplier, lastPrice:price, avgPrice:price, expiry:null, batch:''});
  }
  DB.itemMaster.unshift({id:'im-'+(DB.itemMaster.length+1)+Date.now().toString().slice(-3), name:name, code:code, uom:uom, lastPrice:price,
    supplier1:supplier, supplier2:val('im_sup2')||'', preferredSupplier:supplier, minStock:Number(val('im_min'))||1, reorderLevel:Number(val('im_reorder'))||2,
    active:true, stockType:stockType, stockId:stockId});
  logActivity('Added item master entry', name+' ('+stockType+', '+uom+')');
  closeModal(); toast('Item added to the master catalog'); render();
}

function isFoodItemName(name){ var im=DB.itemMaster.find(m=>m.name.toLowerCase()===String(name||'').toLowerCase()); return im?im.stockType==='food':false; }
function kitchenOperatingCost(dateIso, monthPrefix){
  var today=0, month=0;
  DB.grns.forEach(function(g){
    g.lines.forEach(function(l){
      if(!isFoodItemName(l.name)) return;
      var v=l.receivedQty*l.price;
      if(g.date===dateIso) today+=v;
      if(g.date.slice(0,7)===monthPrefix) month+=v;
    });
  });
  return {today:Math.round(today*1000)/1000, month:Math.round(month*1000)/1000};
}

  if(!m.options.some(o=>o.selected)){ toast('Select at least one dish before approving','error'); return; }
  m.status='Approved';
  logActivity('Approved menu proposal', m.occasion);
  toast('Menu approved — '+m.occasion);
  render();
}
function rejectProposal(id){
  var m=DB.proposedMenus.find(x=>x.id===id); if(!m) return;

    m.status='Rejected';
    logActivity('Rejected menu proposal', m.occasion);
    toast('Menu proposal rejected'); render(); closeModal();
  }, {danger:true, confirmLabel:'Reject'});
}
function logProposalToProduction(id){
  var m=DB.proposedMenus.find(x=>x.id===id); if(!m) return;
  var selected=m.options.filter(o=>o.selected);
  if(!selected.length){ toast('No approved dishes to log','error'); return; }
  var count=0;
  selected.forEach(function(o){
    var r=DB.recipes.find(x=>x.id===o.recipeId); if(!r) return;
    mealSeq++;
    var mlId='ml-'+mealSeq;
    DB.mealLog.unshift({id:mlId, date:D(0), category:m.category, dish:r.name, recipeId:r.id, qty:4, unitCost:computeRecipeCost(r).costPerPortion, loggedBy:currentUserProfile().name, notes:'From approved menu: '+m.occasion});
    consumeIngredientsForMeal(r.id, 4, D(0), mlId);
    count++;
  });
  logActivity('Logged production from approved menu', m.occasion+' — '+count+' dish(es)');
  closeModal(); toast(count+' dish(es) logged to kitchen production from approved menu'); State.kitchenTab='meals'; render();
}

function updateWasteDraftLine(key,field,value){
  var l=(State.wasteDraftLines||[]).find(x=>x.key===key); if(!l) return;
  l[field]= field==='qty'?Number(value)||0:value;
  render();
}
function submitLogWaste(){
  var ready=(State.wasteDraftLines||[]).filter(l=>l.foodInventoryId&&l.qty>0);
  if(!ready.length){ toast('Add at least one wasted item','error'); return; }
  wasteSeq++;
  var lines=ready.map(function(l){
    var stock=DB.foodInventory.find(f=>f.id===l.foodInventoryId);
    stock.qty=Math.max(0, Math.round((stock.qty-l.qty)*1000)/1000);
    return {foodInventoryId:l.foodInventoryId, qty:l.qty, unit:stock.unit, unitCost:stock.cost};
  });
  DB.wasteLog.unshift({id:'wl-'+wasteSeq, date:val('wl_date')||D(0), reason:val('wl_reason')||DB.wasteReasons[0], notes:val('wl_notes')||'', status:'Pending Review', loggedBy:currentUserProfile().name, reviewedBy:null, lines:lines});
  logActivity('Logged kitchen waste', (val('wl_reason')||'')+' — '+ready.length+' item(s)');
  closeModal(); toast('Waste logged — inventory updated'); render();
}

function onIngredientTypeChange(){
  var t=val('ing_type');

  if(subWrap) subWrap.style.display = t==='sub_recipe' ? 'flex' : 'none';

function onIngredientItemPick(){
  var id=val('ing_stockref');
  var stock=DB.foodInventory.find(f=>f.id===id);
  var unitSel=document.getElementById('ing_override_unit'); if(!unitSel) return;
  if(!stock){ unitSel.innerHTML='<option value="">(default)</option>'; return; }
  var compatible=DB.unitsOfMeasure.filter(u=>u.label!==stock.unit && unitsCompatible(u.label, stock.unit));
  unitSel.innerHTML='<option value="">'+stock.unit+' (default)</option>'+compatible.map(u=>'<option value="'+u.id+'">'+u.label+'</option>').join('');
}
function addRecipeIngredient(recipeId){
  var r=DB.recipes.find(x=>x.id===recipeId); if(!r) return;
  var type=val('ing_type')||'stock';
  var yieldPct=Number(val('ing_yield'))||100;
  if(type==='sub_recipe'){
    var subId=val('ing_subrecipe'); if(!subId){ toast('Select a sub-recipe','error'); return; }
    if(recipeIncludesTransitively(recipeId, subId)){ toast("A recipe can't include itself as a sub-recipe, even indirectly",'error'); return; }
    var subQty=Number(val('ing_subqty'))||0;
    r.ingredients.push({subRecipeId:subId, qty:subQty, yieldPct:yieldPct});
  } else {
    var stockId=val('ing_stockref'); if(!stockId){ toast('Select a stock item','error'); return; }
    var qty=Number(val('ing_qty'))||0;
    var overrideUnitId=val('ing_override_unit')||undefined;
    r.ingredients.push({foodInventoryId:stockId, qty:qty, yieldPct:yieldPct, overrideUnitId:overrideUnitId});
  }
  toast('Ingredient added — cost recalculated'); openModal('recipeDetail',{id:recipeId});
}
function removeRecipeIngredient(recipeId, idx){
  var r=DB.recipes.find(x=>x.id===recipeId); if(!r) return;
  r.ingredients.splice(idx,1);
  toast('Ingredient removed'); openModal('recipeDetail',{id:recipeId});
}

function rejectPR(id){ confirmAction('Reject this request?','This purchase request will be marked as rejected.',function(){ var p=DB.purchaseRequests.find(x=>x.id===id); p.status='Rejected'; logActivity('Rejected purchase request', p.item); toast('Purchase request rejected'); },{danger:true,confirmLabel:'Reject'}); }
function convertPRtoPO(id){
  var p=DB.purchaseRequests.find(x=>x.id===id);
  var inv=p.linkedInventoryId?inventoryById(p.linkedInventoryId):null;
  var supplierName=inv?inv.supplier:(DB.suppliers[0]?DB.suppliers[0].name:'—');
  var poId='PO-'+(1046+DB.purchaseOrders.length+1);
  var unitPrice = inv?inv.lastPrice:(p.estCost/p.qty);
  var needsApproval = p.estCost>500;
  DB.purchaseOrders.unshift({id:poId, supplier:supplierName, items:[{name:p.item,qty:p.qty,unit:p.unit,price:unitPrice,orderedPrice:unitPrice,lastPrice: inv?inv.avgPrice:unitPrice,receivedQty:0}], status: needsApproval?'Pending Approval':'Ordered', orderDate:D(0), expectedDate:D(4), total:p.estCost, paymentStatus:'Unpaid'});
  p.status='Ordered → '+poId;
  logActivity('Created purchase order', poId+' from '+p.item+(needsApproval?' — requires Owner approval (over KWD 500)':''));
  closeModal(); toast('Purchase order '+poId+' created'+(needsApproval?' — awaiting Owner approval':'')); render();
}

function submitReceivePO(poId){
  var o=DB.purchaseOrders.find(x=>x.id===poId); if(!o) return;
  var lines=[]; var anyReceived=false; var receiptTotal=0;
  o.items.forEach(function(it,i){
    var qtyNow=Number(val('grn_qty_'+i))||0;
    var pending=it.qty-(it.receivedQty||0);
    qtyNow=Math.max(0,Math.min(qtyNow,pending));
    var orderedPrice = it.orderedPrice!=null ? it.orderedPrice : it.price;
    var actualPrice=Number(val('grn_price_'+i));
    if(!(actualPrice>=0)) actualPrice=orderedPrice;
    if(qtyNow>0){
      anyReceived=true;
      it.receivedQty=(it.receivedQty||0)+qtyNow;
      // The PO line itself (it.price) is never rewritten — it stays a pure
      // historical "as ordered" record. orderedPrice/price on the GRN line
      // capture what was ordered vs what was actually paid.
      lines.push({name:it.name, orderedQty:it.qty, receivedQty:qtyNow, unit:it.unit, orderedPrice:orderedPrice, price:actualPrice});
      receiptTotal+=qtyNow*actualPrice;
      // Update Main Inventory: find a matching item-master entry (by name) to know food vs general stock.
      var im=DB.itemMaster.find(m=>m.name.toLowerCase()===it.name.toLowerCase());
      if(im && im.stockType==='food'){
        var f=DB.foodInventory.find(x=>x.id===im.stockId);
        if(f){
          // True moving-average cost: blend the existing stock value with the
          // value just received, rather than overwriting with the latest price.
          var receivedInStockUnit=convertQty(qtyNow,it.unit,f.unit);
          var oldValue=f.qty*f.cost, newValue=receivedInStockUnit*actualPrice;
          f.qty=Math.round((f.qty+receivedInStockUnit)*1000)/1000;
          f.cost = f.qty>0 ? Math.round((oldValue+newValue)/f.qty*1e6)/1e6 : actualPrice;
        }
      } else {
        var inv=DB.inventory.find(x=>x.name.toLowerCase()===it.name.toLowerCase());
        if(inv){ inv.avgPrice=Math.round(((inv.avgPrice*inv.stock)+(actualPrice*qtyNow))/(inv.stock+qtyNow)*100)/100; inv.stock+=qtyNow; inv.lastPrice=actualPrice; }
      }
      if(im) im.lastPrice=actualPrice;
    }
  });
  if(!anyReceived){ toast('Enter a received quantity for at least one line','error'); return; }
  var fullyReceived=o.items.every(it=>(it.receivedQty||0)>=it.qty);
  o.status=fullyReceived?'Goods Received':'Partially Received';
  grnSeq++;
  var grnId='GRN-'+grnSeq;
  var grnDate=val('grn_date')||D(0);
  DB.grns.unshift({id:grnId, poId:poId, supplier:o.supplier, date:grnDate, receivedBy:val('grn_by')||currentUserProfile().name, lines:lines});
  // Auto-log the receipt as a real expense — closes the gap between
  // Purchasing and the Owner's expense reporting, which previously had no
  // connection to each other.
  DB.expenses.unshift({id:'ex-'+(DB.expenses.length+1)+Date.now().toString().slice(-3), category:'Residence Purchases', amount:Math.round(receiptTotal*100)/100, date:grnDate, supplier:o.supplier, method:'Bank Transfer', notes:'Auto-logged from '+grnId+' — '+poId});
  logActivity('Posted goods receipt', grnId+' for '+poId+' ('+o.supplier+') — '+(fullyReceived?'fully received':'partially received'));
  closeModal(); toast(grnId+' posted — Main Inventory updated'); render();
}

  if(!State.shoppingBasket.length){ toast('Basket is empty','error'); return; }
  var batchLabel='Reorder batch '+fmtDateShort(D(0));
  var count=0;
  State.shoppingBasket.forEach(function(b){
    var im=itemMasterById(b.itemId); if(!im||b.qty<=0) return;
    var stockRec=stockRecordForItem(im);
    DB.purchaseRequests.unshift({id:'pr-'+(DB.purchaseRequests.length+1)+Date.now().toString().slice(-3)+count, item:im.name, qty:b.qty, unit:im.uom, category:im.stockType==='food'?'Kitchen':'General',

      estCost:Math.round(b.qty*im.lastPrice*100)/100, linkedInventoryId:im.stockType==='general'?im.stockId:null, batchLabel:batchLabel});
    count++;
  });
  logActivity('Converted shopping basket to purchase requests', count+' item(s) — '+batchLabel);

  var a={id:'as-'+(++assetSeq), name:name, category:val('na_cat')||'Other', brand:(bm[0]||'').trim()||'—', model:(bm[1]||'').trim()||'—',

    assignedTo:val('na_assignee')||null, documents:0};

  var a=assetById(id); if(!a) return;

    DB.assets=DB.assets.filter(x=>x.id!==id);

    toast('Asset rejected');

}

  var a=assetById(id); var freq=(DB.pmSchedule.find(p=>p.assetId===id)||{}).frequency||'Quarterly';

  a.lastService=D(0); a.nextService=D(days);
  var pm=DB.pmSchedule.find(p=>p.assetId===id); if(pm) pm.dueDate=D(days);
  toast('Service logged — next service '+fmtDate(a.nextService)); closeModal(); render();

/* ======================================================================
   APPROVALS & ACTIVITY LOG MODULE
   Owner/Manager-only: a single inbox aggregating every pending approval across
   Purchasing (PRs & POs), Kitchen (menu proposals), Maintenance (new assets) and
   People (leave requests), plus a full chronological audit trail (DB.activityLog).
   ====================================================================== */
function pendingApprovalsList(){
  var list=[];
  DB.purchaseRequests.filter(p=>p.status==='Pending Approval').forEach(function(p){
    list.push({type:'Purchase Request', icon:'purchasing', title:p.item+' × '+p.qty+' '+p.unit, sub:'Requested by '+p.requestedBy+' · '+fmtKWD(p.estCost||0), date:p.requestDate,
      onApprove:'approvePR(\''+p.id+'\')', onReject:'rejectPR(\''+p.id+'\')', onView:'App.setRoute(\'purchasing\');setPurchaseTab(\'requests\')'});
  });
  DB.purchaseOrders.filter(p=>p.status==='Pending Approval').forEach(function(p){
    list.push({type:'Purchase Order', icon:'purchasing', title:p.id+' — '+p.supplier, sub:p.items.length+' line item(s) · '+fmtKWD(p.total), date:p.orderDate,
      onApprove:'approvePO(\''+p.id+'\')', onReject:'rejectPO(\''+p.id+'\')', onView:'openModal(\'poDetail\',{id:\''+p.id+'\'})'});
  });
  DB.proposedMenus.filter(m=>m.status==='Proposed').forEach(function(m){
    list.push({type:'Menu Proposal', icon:'kitchen', title:m.occasion, sub:'Proposed by '+m.createdBy+' · '+m.options.length+' option(s)', date:m.forDate,
      onApprove:null, onReject:null, onView:'openModal(\'proposalDetail\',{id:\''+m.id+'\'})', reviewLabel:'Review & Select'});
  });
  DB.assets.filter(a=>a.status==='Pending Approval').forEach(function(a){
    list.push({type:'New Asset', icon:'maintenance', title:a.name, sub:a.category+' · '+a.location+(a.purchaseCost?' · '+fmtKWD(a.purchaseCost):''), date:a.installDate,
      onApprove:'approveAsset(\''+a.id+'\')', onReject:'rejectAsset(\''+a.id+'\')', onView:'openModal(\'assetDetail\',{id:\''+a.id+'\'})'});
  });
  DB.leaveRequests.filter(l=>l.status==='Pending').forEach(function(l){

function submitNewUnit(){
  var label=val('nu_label'); if(!label){ toast('Enter a unit label','error'); return; }
  if(uomByLabel(label)){ toast('A unit with that label already exists','error'); return; }
  var baseId=val('nu_base')||null;
  var factor=baseId?(Number(val('nu_factor'))||1):1;
  uomSeq++;
  DB.unitsOfMeasure.push({id:'uom-'+uomSeq, label:label, baseUnitId:baseId, factorToBase:factor});
  logActivity('Added unit of measure', label+(baseId?' (1 '+label+' = '+factor+' '+(uomById(baseId)||{}).label+')':''));
  closeModal(); toast('Unit added'); render();

MODAL_BUILDERS.editUnit = function(pp){
  var u=uomById(pp.id); if(!u) return '<div class="modal"><div class="modal-body">Not found.</div></div>';

function saveUnit(id){
  var u=uomById(id); if(!u) return;
  var label=val('eu_label'); if(!label){ toast('Enter a unit label','error'); return; }
  var dupe=uomByLabel(label); if(dupe&&dupe.id!==id){ toast('A unit with that label already exists','error'); return; }
  u.label=label; u.baseUnitId=val('eu_base')||null; u.factorToBase=u.baseUnitId?(Number(val('eu_factor'))||1):1;
  logActivity('Updated unit of measure', label);
  closeModal(); toast('Unit updated'); render();
}
function removeUnit(id){
  var u=uomById(id); if(!u) return;
  var inUse=DB.unitsOfMeasure.some(o=>o.baseUnitId===id);
  if(inUse){ toast('Other units are based on "'+u.label+'" — update or remove those first','error'); return; }
  confirmAction('Remove "'+u.label+'"?','Anything currently using it will fall back to plain text.', function(){
    DB.unitsOfMeasure=DB.unitsOfMeasure.filter(x=>x.id!==id);
    logActivity('Removed unit of measure', u.label);
    toast('Unit removed'); render();
  }, {danger:true, confirmLabel:'Remove'});
}

  return '<div class="modal"><div class="modal-head"><h3>Add residence area</h3><button class="icon-btn" onclick="closeModal()">'+icon('x')+'</button></div>'+
  '<div class="modal-body">'+field('Area name','ra_name','text','e.g. Second Kitchen, Guest Room 4, Library')+
  '<div class="field"><label>Type</label><input type="text" id="ra_cat" list="ra_cat_list" placeholder="e.g. Kitchen, Dining, Office, Bedroom, Outdoor"><datalist id="ra_cat_list">'+
    ['Bedrooms','Guest Rooms','Kitchen','Living Areas','Bathrooms','Office','Outdoor','Utility','Other'].map(c=>'<option value="'+c+'">').join('')+
  '</datalist></div></div>'+
  '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-brass" onclick="submitNewResidenceArea()">'+icon('check')+'Add Area</button></div></div>';
};
function submitNewResidenceArea(){
  var name=val('ra_name'); if(!name){toast('Please enter an area name','error');return;}
  DB.areas.push({id:'ar-'+(DB.areas.length+1)+Date.now().toString().slice(-3), name:name, category:val('ra_cat')||'Other', checklist:[], lastScore:null, lastInspected:null, assignee:null, completion:0});
  logActivity('Added residence area', name+' ('+(val('ra_cat')||'Other')+')');
  closeModal(); toast('Area added to the residence setup'); render();
}
MODAL_BUILDERS.editResidenceArea = function(p){
  var a=DB.areas.find(x=>x.id===p.id); if(!a) return '<div class="modal"><div class="modal-body">Not found.</div></div>';
  return '<div class="modal"><div class="modal-head"><h3>Edit area</h3><button class="icon-btn" onclick="closeModal()">'+icon('x')+'</button></div>'+
  '<div class="modal-body">'+field('Area name','ra_ename','text').replace('<input','<input value="'+esc(a.name)+'"')+
  '<div class="field"><label>Type</label><input type="text" id="ra_ecat" value="'+esc(a.category)+'" list="ra_ecat_list"><datalist id="ra_ecat_list">'+
    ['Bedrooms','Guest Rooms','Kitchen','Living Areas','Bathrooms','Office','Outdoor','Utility','Other'].map(c=>'<option value="'+c+'">').join('')+
  '</datalist></div></div>'+
  '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-brass" onclick="saveResidenceArea(\''+a.id+'\')">'+icon('check')+'Save</button></div></div>';
};
function saveResidenceArea(id){
  var a=DB.areas.find(x=>x.id===id); if(!a) return;
  var oldName=a.name;
  a.name=val('ra_ename')||a.name; a.category=val('ra_ecat')||a.category;
  if(oldName!==a.name){ DB.assets.forEach(x=>{ if(x.location===oldName) x.location=a.name; }); }
  logActivity('Updated residence area', a.name);
  closeModal(); toast('Area updated'); render();
}
function removeResidenceArea(id){
  var a=DB.areas.find(x=>x.id===id); if(!a) return;
  var assetCount=DB.assets.filter(x=>x.location===a.name).length;
  confirmAction('Remove '+a.name+'?', assetCount?('This area has '+assetCount+' asset(s) linked to it — they will keep their location text but the area will no longer appear in setup lists.'):'This will remove the area from the residence setup.', function(){
    DB.areas=DB.areas.filter(x=>x.id!==id);
    logActivity('Removed residence area', a.name);
    toast('Area removed'); render();
  }, {danger:true, confirmLabel:'Remove'});
}
/* ---- Family Member Logins: separate from the Owner/Admin account and from staff roles.
   Each family account is linked to a DB.family profile and carries its own module allowlist,
   independent of ROLE_NAV — see allowedNav()/currentUserProfile()/login() for the 'fam:'+id role pattern. */
function settingsFamily(){
  var linkedIds=DB.familyAccounts.map(a=>a.familyId);
  var available=DB.family.filter(f=>f.relation!=='Residence Owner'&&!linkedIds.includes(f.id));
  return '<p class="small muted" style="margin-bottom:14px;">Create separate logins for family members, distinct from the Owner/Admin account and from staff accounts. Control exactly which modules each family member can see or use.</p>'+
  '<div class="grid g-cols-3" style="margin-bottom:16px;">'+
    statTile({label:'Family Accounts', icon:'shield', value:DB.familyAccounts.length})+
    statTile({label:'Active', icon:'check', value:DB.familyAccounts.filter(a=>a.active).length})+
    statTile({label:'Available to Add', icon:'people', value:available.length, sub:'From family profiles'})+
  '</div>'+
  '<div class="card"><div class="wrap-scroll"><table><thead><tr><th>Family member</th><th>Relation</th><th>Modules</th><th>Status</th><th></th></tr></thead><tbody>'+
    (DB.familyAccounts.length?DB.familyAccounts.map(function(a){
      var fm=familyMemberById(a.familyId);
      return '<tr><td><div class="row-title">'+esc(a.name)+'</div><div class="row-sub">Login created '+fmtDateShort(a.createdDate)+'</div></td><td class="small muted">'+esc(a.relation)+'</td>'+
      '<td class="small">'+a.modules.length+' of '+NAV.length+'</td>'+
      '<td><span class="badge '+(a.active?'good':'neutral')+'">'+(a.active?'Active':'Disabled')+'</span></td>'+
      '<td><div class="flex gap-2">'+
        '<button class="btn btn-ghost btn-sm" onclick="openModal(\'editFamilyAccess\',{id:\''+a.id+'\'})">'+icon('edit')+'Access</button>'+
        '<button class="btn btn-ghost btn-sm" onclick="toggleFamilyAccountActive(\''+a.id+'\')">'+(a.active?icon('x'):icon('check'))+(a.active?'Disable':'Enable')+'</button>'+
        '<button class="btn btn-ghost btn-sm" onclick="removeFamilyAccount(\''+a.id+'\')">'+icon('trash')+'</button>'+
      '</div></td></tr>';
    }).join(''):'<tr><td colspan="5"><div style="padding:16px;">'+emptyState('No family logins yet','Use \'Add Family Member\' to create one.')+'</div></td></tr>')+
  '</tbody></table></div></div>';
}
MODAL_BUILDERS.newFamilyAccount = function(){
  var linkedIds=DB.familyAccounts.map(a=>a.familyId);
  var available=DB.family.filter(f=>f.relation!=='Residence Owner'&&!linkedIds.includes(f.id));
  if(!available.length) return '<div class="modal"><div class="modal-head"><h3>Add family member login</h3><button class="icon-btn" onclick="closeModal()">'+icon('x')+'</button></div><div class="modal-body">'+emptyState('All family profiles already have logins','Every family member on file already has an account.')+'</div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div></div>';
  return '<div class="modal"><div class="modal-head"><h3>Add family member login</h3><button class="icon-btn" onclick="closeModal()">'+icon('x')+'</button></div>'+
  '<div class="modal-body">'+
  '<div class="field"><label>Family member</label><select id="nf_member">'+available.map(f=>'<option value="'+f.id+'">'+esc(f.name)+' — '+esc(f.relation)+'</option>').join('')+'</select></div>'+
  '<div class="field"><label>Module access</label><div class="flex gap-2" style="flex-wrap:wrap;">'+NAV.filter(n=>n.id!=='settings').map(n=>'<label class="chip" style="cursor:pointer;"><input type="checkbox" class="nf_mod" value="'+n.id+'" style="width:auto;margin-right:5px;" '+(['dashboard','guests','events','documents'].includes(n.id)?'checked':'')+'>'+n.label+'</label>').join('')+'</div></div>'+
  '</div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-brass" onclick="submitNewFamilyAccount()">'+icon('check')+'Create Login</button></div></div>';
};
function submitNewFamilyAccount(){
  var fmId=val('nf_member'); var fm=familyMemberById(fmId); if(!fm){toast('Please choose a family member','error');return;}
  var mods=Array.from(document.querySelectorAll('.nf_mod:checked')).map(x=>x.value);
  if(!mods.includes('dashboard')) mods.unshift('dashboard');
  DB.familyAccounts.push({id:'fa-'+(++familyAccountSeq), familyId:fmId, name:'Family Member — '+fm.relation, relation:fm.relation, modules:mods, active:true, createdDate:D(0)});
  logActivity('Created family login', fm.relation+' — '+mods.length+' modules');
  closeModal(); toast('Family login created'); render();
}
MODAL_BUILDERS.editFamilyAccess = function(p){
  var a=familyAccountById(p.id); if(!a) return '<div class="modal"><div class="modal-body">Not found.</div></div>';
  return '<div class="modal"><div class="modal-head"><h3>'+esc(a.relation)+' — module access</h3><button class="icon-btn" onclick="closeModal()">'+icon('x')+'</button></div>'+
  '<div class="modal-body"><div class="field"><label>Module access</label><div class="flex gap-2" style="flex-wrap:wrap;">'+NAV.filter(n=>n.id!=='settings').map(n=>'<label class="chip" style="cursor:pointer;"><input type="checkbox" class="ef_mod" value="'+n.id+'" style="width:auto;margin-right:5px;" '+(a.modules.includes(n.id)?'checked':'')+(n.id==='dashboard'?' disabled checked':'')+'>'+n.label+'</label>').join('')+'</div></div></div>'+
  '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-brass" onclick="saveFamilyAccess(\''+a.id+'\')">'+icon('check')+'Save Access</button></div></div>';
};
function saveFamilyAccess(id){
  var a=familyAccountById(id); if(!a) return;
  var mods=Array.from(document.querySelectorAll('.ef_mod:checked')).map(x=>x.value);
  if(!mods.includes('dashboard')) mods.unshift('dashboard');
  a.modules=mods;
  logActivity('Updated family access', a.relation+' — '+mods.length+' modules');
  closeModal(); toast('Access updated'); render();
}
function toggleFamilyAccountActive(id){
  var a=familyAccountById(id); if(!a) return;
  a.active=!a.active;
  logActivity(a.active?'Enabled family login':'Disabled family login', a.relation);
  if(!a.active && State.role==='fam:'+a.id){ State.role=null; }
  toast(a.active?'Family login enabled':'Family login disabled'); render();
}
function removeFamilyAccount(id){
  var a=familyAccountById(id); if(!a) return;
  confirmAction('Remove '+a.relation+'\'s login?','This will permanently delete this family login.', function(){
    DB.familyAccounts=DB.familyAccounts.filter(x=>x.id!==id);
    logActivity('Removed family login', a.relation);
    toast('Family login removed'); render();
  }, {danger:true, confirmLabel:'Remove'});
}
function settingsNotif(){
  var cats=['Low inventory','Expiring food','Expiring documents','Pending approvals','Overdue tasks','Maintenance due','Vehicle service due','Staff absence','Upcoming guest','Upcoming event','Budget exceeded'];
  return '<div class="card card-pad"><div class="flex-col gap-2">'+cats.map(function(c){
    return '<label class="flex items-center justify-between" style="padding:9px 4px;border-bottom:1px solid var(--border);cursor:pointer;"><span class="small" style="font-weight:600;">'+c+'</span><input type="checkbox" checked style="width:auto;"></label>';
  }).join('')+'</div></div>';
}

/* --- leave request modal (used from staff personal dashboard) --- */
MODAL_BUILDERS.requestLeave = function(p){
  return '<div class="modal"><div class="modal-head"><h3>Request leave</h3><button class="icon-btn" onclick="closeModal()">'+icon('x')+'</button></div>'+
  '<div class="modal-body">'+selectField('Leave type','lv_type',['Annual Leave','Sick Leave','Emergency Leave','Unpaid Leave'])+
  '<div class="form-grid">'+field('From','lv_from','date').replace('<input','<input value="'+D(7)+'"')+field('To','lv_to','date').replace('<input','<input value="'+D(9)+'"')+'</div>'+
  '<div class="field"><label>Reason</label><textarea id="lv_reason" placeholder="Briefly describe the reason"></textarea></div>'+
  '</div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-brass" onclick="submitLeaveRequest(\''+(p.staffId||'')+'\')">'+icon('check')+'Submit Request</button></div></div>';
};
function submitLeaveRequest(staffId){
  var from=val('lv_from')||D(7), to=val('lv_to')||D(9);
  var days=Math.max(1,Math.round((new Date(to)-new Date(from))/86400000)+1);
  DB.leaveRequests.unshift({id:'lv-'+(DB.leaveRequests.length+1), staffId:staffId||DB.staff[0].id, type:val('lv_type')||'Annual Leave', from:from, to:to, days:days, status:'Pending', reason:val('lv_reason')||'', requestedOn:D(0)});
  closeModal(); toast('Leave request submitted'); render();
}

/* ----------------------------- INIT ----------------------------- */
document.addEventListener('keydown', function(ev){
  if(ev.key==='Escape'){
    if(State.modal){ closeModal(); }
    else if(State.notifOpen||State.roleMenuOpen||State.mobileMoreOpen){ State.notifOpen=false; State.roleMenuOpen=false; State.mobileMoreOpen=false; render(); }
  }
});
window.addEventListener('resize', function(){ /* CSS handles layout; no-op hook for future use */ });
if(window.matchMedia){
  try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if(State.theme==='system') render(); }); }catch(e){}
}
render();
</script>
