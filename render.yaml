databases:
  - name: hadlaan-db
    databaseName: hadlaan
    user: hadlaan
    region: frankfurt

services:
  - type: web
    name: hadlaan-backend
    runtime: docker
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hadlaan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # The frontend is served from a custom domain, not the default
      # hadlaan-frontend.onrender.com — CORS_ORIGINS must list every origin
      # the frontend is actually reachable at (comma-separated; see
      # Settings.cors_origin_list), or the browser's preflight check fails
      # with no Access-Control-Allow-Origin header. Keep the .onrender.com
      # URL too so the default Render URL still works for testing.
      - key: CORS_ORIGINS
        value: https://butler.elanorasystems.com,https://hadlaan-frontend.onrender.com
      # Embedded in generated QR codes (patrol check-in) — must be wherever
      # real users actually load the app.
      - key: APP_BASE_URL
        value: https://butler.elanorasystems.com

  - type: web
    name: hadlaan-frontend
    runtime: static
    # Static sites are served from Render's global CDN, not a single
    # region — no `region` field allowed here (unlike the database and
    # the docker web service above).
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # This app uses client-side routing (React Router) — without this,
      # refreshing any page other than / 404s.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://hadlaan-backend.onrender.com/api/v1
