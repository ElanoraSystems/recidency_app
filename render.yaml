databases:
  - name: hadlaan-db
    databaseName: hadlaan
    user: hadlaan
    region: frankfurt

services:
  - type: web
    name: hadlaan-backend
    runtime: docker
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hadlaan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # These two point at the frontend service below. Render assigns
      # https://<name>.onrender.com unless that name is already taken by
      # someone else on Render, in which case update both this and the
      # frontend's VITE_API_BASE_URL to match whatever URL Render actually
      # assigns after the first deploy.
      - key: CORS_ORIGINS
        value: https://hadlaan-frontend.onrender.com
      - key: APP_BASE_URL
        value: https://hadlaan-frontend.onrender.com

  - type: web
    name: hadlaan-frontend
    runtime: static
    # Static sites are served from Render's global CDN, not a single
    # region — no `region` field allowed here (unlike the database and
    # the docker web service above).
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # This app uses client-side routing (React Router) — without this,
      # refreshing any page other than / 404s.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://hadlaan-backend.onrender.com/api/v1
